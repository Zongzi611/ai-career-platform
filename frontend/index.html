<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerSail 大学生职业规划智能体</title>
  <style>
    html.dark body { background: #1a1a2e; }
    html.dark .main-content-area,
    html.dark .login-page,
    html.dark .reg-page {
      filter: invert(0.9) hue-rotate(180deg);
    }
    html.dark .main-content-area img, html.dark .main-content-area video,
    html.dark .main-content-area .el-avatar, html.dark .main-content-area .nav-avatar,
    html.dark .main-content-area .sc-avatar, html.dark .main-content-area .pc-avatar,
    html.dark .main-content-area .t-avatar,
    html.dark .login-page img, html.dark .reg-page img {
      filter: invert(0.9) hue-rotate(180deg) !important;
    }
    @media print {
      html.dark .main-content-area { filter: none; }
      body * { visibility: hidden; }
      .report-content, .report-content * { visibility: visible; }
      .report-content { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
