# ============================================================
# 开发环境配置 — 通义千问云端API + 本地基础设施
# ============================================================
spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.chroma.ChromaVectorStoreAutoConfiguration
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:mysql://localhost:3306/careersail_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DEV_DB_PASSWORD:131452}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000

  # Redis — Memurai (Windows 原生 Redis) 默认端口 6379
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
      timeout: 5000ms

  ai:
    # ===== DeepSeek V4 Pro — OpenAI 兼容接口 =====
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        enabled: true
        completions-path: /chat/completions
        options:
          model: deepseek-v4-pro
          temperature: 0.7
          top-p: 0.9
      embedding:
        enabled: false   # 使用自定义 LocalEmbeddingModel，不调 DeepSeek embedding

    # ===== 通义千问 (DashScope) — 已切换为备选，需要时取消注释 =====
    # openai:
    #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api-key: ${DASHSCOPE_API_KEY:}
    #   chat:
    #     enabled: true
    #     completions-path: /chat/completions
    #     options:
    #       model: qwen-turbo
    #       temperature: 0.7
    #       top-p: 0.9
    #   embedding:
    #     enabled: true
    #     embeddings-path: /embeddings
    #     options:
    #       model: text-embedding-v2
    #       temperature: 0.0

    # ===== Ollama (本地离线) — 备选方案 =====
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: false
        model: qwen:7b
        options:
          temperature: 0.7
      embedding:
        enabled: false
        model: nomic-embed-text

    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1000
        multiplier: 2

    # Chroma 向量库 — 已禁用，使用内存 SimpleVectorStore
    # vectorstore:
    #   chroma:
    #     initialize-schema: true
    #     collection-name: career_knowledge

logging:
  level:
    com.careersail: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.ai.openai: TRACE
    org.springframework.web.client: DEBUG
    org.springframework.security: DEBUG
