version: '3.8'

services:
  # ===== MySQL 8.0 =====
  mysql:
    image: mysql:8.0
    container_name: careersail-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 131452
      MYSQL_DATABASE: careersail_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p131452"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: careersail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Chroma Vector DB =====
  chroma:
    image: chromadb/chroma:latest
    container_name: careersail-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ===== CareerSail Backend (built from Dockerfile) =====
  app:
    build: .
    container_name: careersail-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROD_DB_HOST: mysql
      PROD_DB_USERNAME: root
      PROD_DB_PASSWORD: 131452
      PROD_REDIS_HOST: redis
      AI_PROVIDER: ollama
      AI_MODEL_NAME: qwen:7b
      JWT_SECRET: careersail-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256

  # ===== Nginx (frontend static + reverse proxy) =====
  nginx:
    image: nginx:alpine
    container_name: careersail-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data:
  chroma-data:
